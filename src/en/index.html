<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Joe — Products</title>
  <style>
    :root {
      --bg: #fafafa;
      --surface: #fff;
      --text: #141414;
      --muted: #5c5c5c;
      --border: #e8e8e8;
      --accent: #0b57d0;
      --tag-bg: #f0f2f5;
      --radius: 12px;
      --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: .75rem 1.5rem;
      margin-bottom: 1.75rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    header .identity {
      display: flex;
      align-items: center;
      gap: .9rem;
      min-width: 0;
    }
    header .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
      background: var(--surface);
      flex: 0 0 auto;
      box-shadow: var(--shadow);
    }
    header .identity-text {
      min-width: 0;
    }
    header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    header .role {
      color: var(--muted);
      font-size: .95rem;
    }
    header nav a {
      color: var(--accent);
      text-decoration: none;
      font-size: .9rem;
      margin-left: 1rem;
    }
    header nav a:hover { text-decoration: underline; }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin-bottom: 1rem;
    }
    .tab {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 999px;
      padding: .45rem .95rem;
      font-size: .875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
    }
    .tab:hover { border-color: #ccc; }
    .tab[aria-selected="true"] {
      background: var(--text);
      border-color: var(--text);
      color: #fff;
    }
    .tab .count {
      opacity: .65;
      font-weight: 400;
      margin-left: .25rem;
    }

    .filters {
      display: flex;
      flex-direction: column;
      gap: .55rem;
      margin-bottom: 1.25rem;
    }
    .filter-group {
      display: grid;
      grid-template-columns: 5.75rem minmax(0, 1fr) auto;
      align-items: start;
      column-gap: .5rem;
      row-gap: .35rem;
    }
    .filter-group-label {
      grid-column: 1;
      padding-top: .28rem;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .03em;
      text-transform: uppercase;
    }
    .filter-group-label.domain { color: #5b2b9e; }
    .filter-group-label.stack { color: #174ea6; }
    .filter-group-label.lang { color: #1b5e20; }
    .filter-group-chips {
      grid-column: 2;
      display: flex;
      flex-wrap: wrap;
      gap: .28rem;
      min-width: 0;
      /* one line when collapsed */
      max-height: 1.55rem;
      overflow: hidden;
    }
    .filter-group.open .filter-group-chips {
      max-height: none;
      overflow: visible;
    }
    .filter-group-more {
      grid-column: 3;
      appearance: none;
      border: none;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: .7rem;
      font-weight: 550;
      cursor: pointer;
      padding: .2rem .15rem;
      white-space: nowrap;
      align-self: start;
    }
    .filter-group-more:hover { color: var(--text); }
    .filter-group-more.hidden { visibility: hidden; pointer-events: none; }
    .chip {
      appearance: none;
      border-radius: 999px;
      padding: .18rem .5rem;
      font-size: .7rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--muted);
      line-height: 1.25;
    }
    .chip:hover {
      color: var(--text);
      border-color: #ccc;
      background: #f7f7f7;
    }
    /* selected: type colors */
    .chip.domain[aria-pressed="true"] {
      background: #7b1fa2;
      border-color: #6a1b9a;
      color: #fff;
      font-weight: 600;
    }
    .chip.stack[aria-pressed="true"] {
      background: #1967d2;
      border-color: #174ea6;
      color: #fff;
      font-weight: 600;
    }
    .chip.lang[aria-pressed="true"] {
      background: #2e7d32;
      border-color: #1b5e20;
      color: #fff;
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }
    .card {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.15rem 1.2rem 1.2rem;
      box-shadow: var(--shadow);
      text-decoration: none;
      color: inherit;
      transition: border-color .15s, transform .15s, box-shadow .15s;
      min-height: 11.5rem;
    }
    .card:hover {
      border-color: #c8d4ea;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(11,87,208,.08);
    }
    .card.hidden { display: none; }
    .card h2 {
      margin: 0 0 .35rem;
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: -0.01em;
    }
    .card .blurb {
      margin: 0 0 .85rem;
      color: var(--muted);
      font-size: .88rem;
      flex: 1;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: .3rem;
    }
    .tag {
      font-size: .68rem;
      font-weight: 500;
      padding: .15rem .4rem;
      border-radius: 5px;
      white-space: nowrap;
    }
    .tag.domain {
      background: #f3eefc;
      color: #5b2b9e;
    }
    .tag.stack {
      background: #e8f0fe;
      color: #174ea6;
    }
    .tag.lang {
      background: #e8f5e9;
      color: #1b5e20;
    }
    .meta {
      margin-top: .75rem;
      font-size: .72rem;
      color: #888;
    }
    .empty {
      display: none;
      color: var(--muted);
      font-size: .95rem;
      padding: 2rem 0;
    }
    .empty.show { display: block; }
    footer {
      margin-top: 2.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      font-size: .8rem;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="identity">
        <img class="avatar" src="avatar.jpg" width="64" height="64" alt="Joe" />
        <div class="identity-text">
          <h1>Joe</h1>
          <div class="role">Products · tooling · enterprise delivery</div>
        </div>
      </div>
      <nav>
        <a href="https://www.linkedin.com/in/mi-zhou-46553092/" rel="noopener">LinkedIn</a>
      </nav>
    </header>

    <div class="tabs" role="tablist" aria-label="Product categories">
      <button type="button" class="tab" role="tab" data-tab="all" aria-selected="true">All <span class="count" data-count-for="all"></span></button>
      <button type="button" class="tab" role="tab" data-tab="products" aria-selected="false">Products <span class="count" data-count-for="products"></span></button>
      <button type="button" class="tab" role="tab" data-tab="tooling" aria-selected="false">Tooling <span class="count" data-count-for="tooling"></span></button>
      <button type="button" class="tab" role="tab" data-tab="enterprise" aria-selected="false">Enterprise <span class="count" data-count-for="enterprise"></span></button>
    </div>

    <div class="filters" id="attr-filters" aria-label="Filter by domain, stack, or language"></div>

    <div class="grid" id="grid"></div>
    <p class="empty" id="empty">No products match this filter.</p>

    <footer>Product-focused catalog · detail pages linked from each card</footer>
  </div>

  <script>
    /**
     * Tag model (exactly 3 types):
     * - languages: programming languages (Go, TypeScript, Python, …)
     * - stack: frameworks / platforms / infra (FastAPI, Flutter, AWS, …)
     * - domain: business domain (education, e-commerce, DevOps, finance, …)
     * Filter chips are grouped: Language · Tech stack · Domain.
     */
    const PRODUCTS = [
      {
        id: "tutored",
        name: "Tutored",
        href: "projects/tutored.html",
        blurb: "Language-learning product suite — web, mobile, and production-minded AWS deploy.",
        tab: "products",
        languages: ["TypeScript", "Dart"],
        stack: ["SvelteKit", "Fastify", "Flutter", "AWS", "Docker", "Caddy"],
        domain: ["Education", "AI"],
        meta: "Founder · 2026–"
      },
      {
        id: "olilo",
        name: "Olilo",
        href: "projects/olilo.html",
        blurb: "SEC 13F (AI13F) filings to portfolio analytics — ETL, API, charts, LLM insight reports.",
        tab: "products",
        languages: ["Python", "TypeScript"],
        stack: ["FastAPI", "SvelteKit", "PostgreSQL", "Docker"],
        domain: ["Finance", "Data", "AI"],
        meta: "Founder · 2026–"
      },
      {
        id: "mohiguide",
        name: "Mohiguide",
        href: "projects/pet_ecom.html",
        blurb: "Pet-services O2O platform. Multi-surface commerce; planned GenAI enrichment (AIHub lineage).",
        tab: "products",
        languages: ["Go", "Dart", "TypeScript"],
        stack: ["Flutter", "SvelteKit", "GraphQL", "React", "AWS"],
        domain: ["E-commerce", "AI"],
        meta: "Founder · 2022–"
      },
      {
        id: "deploybot",
        name: "DeployBot",
        href: "projects/deploybot.html",
        blurb: "Agentic DevOps workflows for container build, deploy, and diagnostics.",
        tab: "tooling",
        languages: ["Go"],
        stack: ["Docker", "Kubernetes", "CI/CD"],
        domain: ["DevOps", "AI"],
        meta: "Founder · open-source · 2024–"
      },
      {
        id: "defect-drainer",
        name: "DefectDrainer",
        href: "projects/defect_drainer.html",
        blurb: "Defect inventory channel — capture evidence first, batch-fix later.",
        tab: "tooling",
        languages: ["TypeScript"],
        stack: ["Fastify", "React"],
        domain: ["Quality", "DevOps"],
        meta: "Founder · open-source · active/planned"
      },
      {
        id: "skill-forge",
        name: "Skill Forge",
        href: "projects/skill_forge.html",
        blurb: "Registry and sync for agent skills, instructions, and subagents.",
        tab: "tooling",
        languages: ["JavaScript", "TypeScript"],
        stack: ["Node.js", "CLI"],
        domain: ["Agent tooling", "Developer platform"],
        meta: "Founder · open-source · developer platform"
      },
      {
        id: "mapgenie",
        name: "MapGenie",
        href: "projects/edi.html",
        blurb: "AI-assisted EDI mapping & logistics automation for Maersk — production go-live and awards.",
        tab: "enterprise",
        languages: ["Python", "TypeScript"],
        stack: ["FastAPI", "React", "Azure", "AKS", "RAG"],
        domain: ["Logistics", "EDI", "AI"],
        meta: "IBM client delivery · 2025–2026"
      },
      {
        id: "kone",
        name: "KONE Connected Services",
        href: "projects/kone.html",
        blurb: "Watson IoT → AWS IoT re-platform — fleet connectivity, telemetry ops, DevOps/CI/CD for predictive maintenance at scale.",
        tab: "enterprise",
        languages: ["Java", "Python"],
        stack: ["AWS IoT Core", "S3", "CI/CD"],
        domain: ["IoT", "Cloud operations", "DevOps"],
        meta: "IBM client delivery · 2020–2021"
      },
      {
        id: "glob-ecom",
        name: "Global e-commerce",
        href: "projects/glob_ecom.html",
        blurb: "China-market mobile/web localization for Oriflame — regional UX with global systems of record.",
        tab: "enterprise",
        languages: ["Swift", "Kotlin", "Java"],
        stack: ["BFF", "CDN", "Mobile"],
        domain: ["E-commerce", "Localization"],
        meta: "IBM client delivery · 2017–2019"
      }
    ];

    let activeTab = "all";
    /** Selected filter labels (AND). Any match against languages | stack | domain. */
    let activeFilters = new Set();

    const grid = document.getElementById("grid");
    const empty = document.getElementById("empty");
    const filtersEl = document.getElementById("attr-filters");

    const FILTER_GROUPS = [
      { key: "domain", label: "Domain", chipClass: "domain" },
      { key: "stack", label: "Tech stack", chipClass: "stack" },
      { key: "languages", label: "Language", chipClass: "lang" }
    ];

    function collectUsed(key) {
      const used = new Set();
      PRODUCTS.forEach(p => (p[key] || []).forEach(t => used.add(t)));
      return [...used].sort((a, b) => a.localeCompare(b));
    }

    function productHasLabel(p, label) {
      return p.languages.includes(label) || p.stack.includes(label) || p.domain.includes(label);
    }

    /** Expanded when tags need more than one line. */
    const groupOpen = { domain: false, stack: false, languages: false };

    function renderFilters() {
      filtersEl.innerHTML = "";
      FILTER_GROUPS.forEach(group => {
        const labels = collectUsed(group.key);
        if (!labels.length) return;

        const open = !!groupOpen[group.key];
        const row = document.createElement("div");
        row.className = "filter-group" + (open ? " open" : "");
        row.dataset.key = group.key;
        row.setAttribute("role", "group");
        row.setAttribute("aria-label", group.label);

        const title = document.createElement("span");
        title.className = `filter-group-label ${group.chipClass}`;
        title.textContent = group.label;

        const chips = document.createElement("div");
        chips.className = "filter-group-chips";

        labels.forEach(label => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = `chip ${group.chipClass}`;
          b.textContent = label;
          b.setAttribute("aria-pressed", activeFilters.has(label) ? "true" : "false");
          b.addEventListener("click", () => {
            if (activeFilters.has(label)) activeFilters.delete(label);
            else activeFilters.add(label);
            b.setAttribute("aria-pressed", activeFilters.has(label) ? "true" : "false");
            applyFilters();
          });
          chips.appendChild(b);
        });

        const more = document.createElement("button");
        more.type = "button";
        more.className = "filter-group-more hidden";
        more.setAttribute("aria-expanded", open ? "true" : "false");
        more.textContent = open ? "Less" : "More";
        more.addEventListener("click", () => {
          groupOpen[group.key] = !groupOpen[group.key];
          renderFilters();
        });

        row.appendChild(title);
        row.appendChild(chips);
        row.appendChild(more);
        filtersEl.appendChild(row);
      });

      // After layout: show More only when chips wrap past one line
      requestAnimationFrame(() => {
        filtersEl.querySelectorAll(".filter-group").forEach(row => {
          const chips = row.querySelector(".filter-group-chips");
          const more = row.querySelector(".filter-group-more");
          if (!chips || !more) return;
          const wasOpen = row.classList.contains("open");
          // measure collapsed height
          row.classList.remove("open");
          const overflows = chips.scrollHeight > chips.clientHeight + 1;
          if (wasOpen) row.classList.add("open");
          if (overflows || wasOpen) {
            more.classList.remove("hidden");
            more.textContent = wasOpen ? "Less" : "More";
            more.setAttribute("aria-expanded", wasOpen ? "true" : "false");
          } else {
            more.classList.add("hidden");
          }
        });
      });
    }

    window.addEventListener("resize", () => {
      // re-check overflow without resetting open state
      requestAnimationFrame(() => {
        filtersEl.querySelectorAll(".filter-group").forEach(row => {
          const chips = row.querySelector(".filter-group-chips");
          const more = row.querySelector(".filter-group-more");
          if (!chips || !more) return;
          const wasOpen = row.classList.contains("open");
          row.classList.remove("open");
          const overflows = chips.scrollHeight > chips.clientHeight + 1;
          if (wasOpen) row.classList.add("open");
          if (overflows || wasOpen) {
            more.classList.remove("hidden");
            more.textContent = wasOpen ? "Less" : "More";
          } else {
            more.classList.add("hidden");
            const key = row.dataset.key;
            if (key) groupOpen[key] = false;
          }
        });
      });
    });

    function matches(p) {
      if (activeTab !== "all" && p.tab !== activeTab) return false;
      if (activeFilters.size === 0) return true;
      for (const label of activeFilters) {
        if (!productHasLabel(p, label)) return false;
      }
      return true;
    }

    function renderCards() {
      grid.innerHTML = "";
      let visible = 0;
      PRODUCTS.forEach(p => {
        const show = matches(p);
        const a = document.createElement("a");
        a.className = "card" + (show ? "" : " hidden");
        a.href = p.href;
        a.dataset.tab = p.tab;
        if (show) visible++;

        const tagsHtml = [
          ...p.domain.map(t => `<span class="tag domain">${t}</span>`),
          ...p.stack.map(t => `<span class="tag stack">${t}</span>`),
          ...p.languages.map(t => `<span class="tag lang">${t}</span>`)
        ].join("");

        a.innerHTML = `
          <h2>${p.name}</h2>
          <p class="blurb">${p.blurb}</p>
          <div class="tags">${tagsHtml}</div>
          <div class="meta">${p.meta}</div>
        `;
        grid.appendChild(a);
      });
      empty.classList.toggle("show", visible === 0);

      ["all", "products", "tooling", "enterprise"].forEach(tab => {
        const n = PRODUCTS.filter(p => {
          if (tab !== "all" && p.tab !== tab) return false;
          if (activeFilters.size === 0) return true;
          for (const label of activeFilters) if (!productHasLabel(p, label)) return false;
          return true;
        }).length;
        const el = document.querySelector(`[data-count-for="${tab}"]`);
        if (el) el.textContent = `(${n})`;
      });
    }

    function applyFilters() {
      renderCards();
    }

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        activeTab = tab.dataset.tab;
        document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t === tab ? "true" : "false"));
        applyFilters();
      });
    });

    renderFilters();
    renderCards();
  </script>
</body>
</html>
