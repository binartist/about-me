name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PANDOC_VERSION: "3.10.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: scripts/build.sh stamps pages from git log.
          fetch-depth: 0

      - name: Install Pandoc
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "$arch" in
            amd64|arm64) ;;
            *) echo "unsupported arch: ${arch}" >&2; exit 1 ;;
          esac
          pkg="pandoc-${PANDOC_VERSION}-1-${arch}.deb"
          url="https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/${pkg}"
          echo "Downloading ${url}"
          curl -fsSL -o /tmp/pandoc.deb "${url}"
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version

      - name: Build HTML
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
